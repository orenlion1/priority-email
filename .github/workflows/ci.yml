name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Python syntax
        run: python -m compileall scripts tests

      - name: Unit tests
        # The Slack command/handler tests skip themselves when slackkit is not
        # importable (it ships from CodeArtifact into the Lambda bundle, not onto
        # the CI path); the poller tests do not depend on it and always run.
        run: python -m unittest discover tests

      - name: Shell syntax
        run: |
          bash -n \
            scripts/aws/bootstrap-aws.sh \
            scripts/aws/build-lambda-zip.sh \
            scripts/aws/deploy-lambda.sh \
            scripts/aws/build-slack-lambda-zip.sh \
            scripts/aws/deploy-slack-lambda.sh \
            scripts/aws/sync-runtime-secret.sh \
            scripts/filters/add-filter-op.sh \
            scripts/filters/decrypt-filters.sh \
            scripts/filters/sync-filters-to-s3.sh

      - name: Secret and forbidden-path scan
        run: python scripts/ci/secret-scan.py

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Format
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
